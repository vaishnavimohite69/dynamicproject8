
<!DOCTYPE html>
<html>

<head>

    <meta charset="ISO-8859-1">

    <title>Product Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .container {
            width: 400px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
        }

        a {
            display: block;
            text-decoration: none;
            padding: 14px;
            margin: 15px 0;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .add {
            background: #222;
            color: white;
        }

        .add:hover {
            background: #555;
        }

        .view {
            background: #e9ecef;
            color: #222;
        }

        .view:hover {
            background: #d6d9dc;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Product Management</h1>

        <a href="product..html" class="add">
            Add Product
        </a>

        <a href="view" class="view">
            View All Products
        </a>

    </div>

</body>

</html>
