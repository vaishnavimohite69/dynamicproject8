<!DOCTYPE html>
<html>

<head>
    <meta charset="ISO-8859-1">
    <title>Add Product</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #333;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.15);
        }

        input[type="submit"] {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Add Product</h2>

        <form action="add" method="post">

            <div class="form-group">
                <label>Product Code</label>
                <input type="text" name="code" placeholder="Enter product code">
            </div>

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" placeholder="Enter product name">
            </div>

            <div class="form-group">
                <label>Product Price</label>
                <input type="text" name="price" placeholder="Enter product price">
            </div>

            <div class="form-group">
                <label>Product Quantity</label>
                <input type="text" name="qty" placeholder="Enter quantity">
            </div>

            <input type="submit" value="Add Product">

        </form>

    </div>

</body>

</html>
